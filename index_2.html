<style>
:root{
  /* Layout: deep green header band, light sheet with rounded top sliding over it, white cards, bottom tab bar. */
  --hdr-1:#174a32; --hdr-2:#2b7350;
  --brand:#24704a; --brand-ink:#ffffff; --brand-soft:#dcefe3; --brand-softer:#eef6f1;
  --bg:#eef1ef; --card:#ffffff; --ink:#121a16; --muted:#67736d; --line:#e3e8e5; --chip:#f1f4f2;
  --black:#121614; --black-ink:#ffffff;
  --good:#1d8a4b; --good-soft:#e2f3e8; --bad:#d2402f; --bad-soft:#fbe7e4; --info:#2c6be0; --info-soft:#e4edfd; --warn:#a86e12; --warn-soft:#fbf0dc;
  --s-bank:#00806b; --s-fx:#4a62b5; --s-gold:#a67a1c; --s-inv:#b4457f;
  --font:"Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-card:16px; --r-sheet:26px;
  --tabbar-h:64px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --hdr-1:#0f3322; --hdr-2:#1d5a3c;
    --brand:#4cc185; --brand-ink:#05190f; --brand-soft:#1d3a2c; --brand-softer:#16261e;
    --bg:#0d1210; --card:#171f1b; --ink:#e7eeea; --muted:#94a39b; --line:#26312c; --chip:#1f2924;
    --black:#e7eeea; --black-ink:#0d1210;
    --good:#55c987; --good-soft:#163323; --bad:#f07a6a; --bad-soft:#3a1d19; --info:#7ea6f2; --info-soft:#18243b; --warn:#e3ad52; --warn-soft:#33270f;
    --s-bank:#2fa88f; --s-fx:#6f88dd; --s-gold:#b38a2c; --s-inv:#d0679c;
    color-scheme:dark;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--hdr-1);color:var(--ink);font:15px/1.45 var(--font);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
h2{font-size:19px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:15px;font-weight:700}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
[hidden]{display:none !important}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- header ---------- */
.app{min-height:100%;display:flex;flex-direction:column;background:linear-gradient(160deg,var(--hdr-2),var(--hdr-1) 70%)}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(env(safe-area-inset-top) + 14px) 18px 30px;color:#fff}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.brand svg{width:30px;height:30px}
.hdr-actions{display:flex;gap:8px;align-items:center}
.round{width:38px;height:38px;border-radius:50%;border:none;display:grid;place-items:center;background:rgba(255,255,255,.16);color:#fff;cursor:pointer;position:relative}
.round:active{transform:scale(.96)}
.round.avatar{background:#f4f1ea;color:var(--hdr-1);font-weight:800}
.round .badge{position:absolute;top:-2px;right:-2px;min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px;border:2px solid var(--hdr-2)}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- sheet (main content) ---------- */
.main{flex:1;background:var(--bg);border-radius:var(--r-sheet) var(--r-sheet) 0 0;margin-top:-14px;padding:20px 16px calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 28px);position:relative}
.view{display:none;flex-direction:column;gap:18px;max-width:640px;margin:0 auto}
.view.active{display:flex}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pill-btn{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.pill-btn svg.i{width:14px;height:14px}
.pill-btn.dark{background:var(--black);color:var(--black-ink);border-color:var(--black)}

/* ---------- cards ---------- */
.card{background:var(--card);border-radius:var(--r-card);padding:14px;border:1px solid var(--line)}
.card.flat{border:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border-radius:14px;padding:12px;border:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0;position:relative;text-align:left;cursor:pointer}
.tile .t-label{font-size:12.5px;color:var(--muted);padding-right:30px}
.tile .t-val{font-size:16.5px;font-weight:800;overflow-wrap:anywhere}
.tile .t-sub{font-size:12px;color:var(--muted)}
.ico{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--brand)}
.ico svg.i{width:14px;height:14px;stroke-width:2.2}

.hero{background:var(--card);border-radius:20px;padding:16px;border:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.hero .label{font-size:13px;color:var(--muted);font-weight:600}
.hero .big{font-size:clamp(30px,9vw,38px);font-weight:800;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.hero-row{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.share{display:flex;gap:2px;height:8px;border-radius:4px;overflow:hidden;margin-top:6px;background:var(--chip)}
.share span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:1px}

.status{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.status.good{background:var(--good-soft);color:var(--good)}
.status.bad{background:var(--bad-soft);color:var(--bad)}
.status.info{background:var(--info-soft);color:var(--info)}
.status.warn{background:var(--warn-soft);color:var(--warn)}
.status.plain{background:var(--chip);color:var(--muted)}
.status.solid{background:var(--brand);color:var(--brand-ink)}

/* list rows */
.list{background:var(--card);border-radius:var(--r-card);border:1px solid var(--line);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:none;border-right:none;border-top:none;text-align:left;cursor:pointer}
.row:last-child{border-bottom:none}
.row:active{background:var(--chip)}
.row .grow{flex:1;min-width:0}
.row .title{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-weight:800;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .amt small{display:block;font-weight:600;font-size:12px;color:var(--muted)}
.avatar-ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:800;font-size:12px;background:var(--brand-softer);color:var(--brand)}
.avatar-ic svg.i{width:18px;height:18px}
.avatar-ic.bad{background:var(--bad-soft);color:var(--bad)}
.avatar-ic.good{background:var(--good-soft);color:var(--good)}
.avatar-ic.info{background:var(--info-soft);color:var(--info)}
.avatar-ic.warn{background:var(--warn-soft);color:var(--warn)}
.group-label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:4px 2px}
.pos{color:var(--good)} .neg{color:var(--bad)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;margin:0 -16px;padding-left:16px;padding-right:16px;scrollbar-width:none;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;scroll-snap-align:start}
.chip.on{background:var(--black);color:var(--black-ink);border-color:var(--black)}
.chip small{color:var(--muted);font-weight:500;margin-left:4px}
.chip.on small{color:inherit;opacity:.7}

/* segmented */
.seg{display:flex;background:var(--chip);border-radius:999px;padding:3px;gap:2px}
.seg button{flex:1;border:none;background:none;border-radius:999px;padding:7px 10px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* meter */
.meter{height:8px;border-radius:4px;background:var(--chip);overflow:hidden}
.meter span{display:block;height:100%;background:var(--brand);border-radius:4px}
.meter.over span{background:var(--bad)}

/* charts */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font:600 10.5px var(--font)}
.tip{position:absolute;pointer-events:none;background:var(--black);color:var(--black-ink);border-radius:10px;padding:6px 9px;font-size:12px;white-space:nowrap;z-index:3;font-variant-numeric:tabular-nums}

/* kv rows (detail) */
.kv{display:flex;flex-direction:column;background:var(--card);border-radius:14px;border:1px solid var(--line)}
.kv div{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line);font-size:14px}
.kv div:last-child{border-bottom:none}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}

/* ---------- tab bar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom));z-index:20}
.tabbar a,.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:600;background:none;border:none;cursor:pointer;padding:4px 0;max-width:90px}
.tabbar a[aria-current="page"]{color:var(--ink)}
.tabbar a[aria-current="page"] svg.i{stroke-width:2.3}
.tabbar .add{flex:none;width:50px;height:50px;border-radius:50%;background:var(--black);color:var(--black-ink);display:grid;place-items:center;margin-top:-22px;box-shadow:0 6px 16px rgba(0,0,0,.2)}
.tabbar .add svg.i{width:24px;height:24px;stroke-width:2.4}

/* ---------- bottom sheets ---------- */
.scrim{position:fixed;inset:0;background:rgba(8,14,11,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s ease}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;border-radius:var(--r-sheet) var(--r-sheet) 0 0;display:flex;flex-direction:column;animation:up .22s cubic-bezier(.2,.8,.2,1)}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:18px 18px 10px}
.sheet-head p{margin-top:3px}
.sheet-body{overflow-y:auto;padding:4px 18px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.x{width:32px;height:32px;border-radius:50%;border:none;background:var(--chip);display:grid;place-items:center;cursor:pointer;flex:none}
.x svg.i{width:16px;height:16px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

/* forms */
.form{display:flex;flex-direction:column;gap:12px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select{width:100%;min-height:46px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;font-size:16px}
.field input:focus,.field select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.field .amount{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.hint{font-size:13px;color:var(--muted)}
.hint b{color:var(--ink)}
.err{font-size:13px;color:var(--bad);min-height:0}
.err:empty{display:none}
.actions{display:flex;gap:10px}
.btn{flex:1;min-height:48px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 16px}
.btn.dark{background:var(--black);color:var(--black-ink);border-color:var(--black)}
.btn.green{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.toggle input{width:44px;height:26px;appearance:none;background:var(--line);border-radius:13px;position:relative;cursor:pointer;flex:none;transition:background .15s}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle input:checked{background:var(--brand)}
.toggle input:checked::after{transform:translateX(18px)}

/* action grid in Add sheet */
.actgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.act{display:flex;flex-direction:column;align-items:flex-start;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;cursor:pointer}
.act b{font-size:14px}
.act span{font-size:12px;color:var(--muted)}

/* misc */
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);color:var(--ink);border-radius:14px;padding:12px;font-size:13.5px}
.banner.info{background:var(--info-soft)}
.banner .grow{flex:1}
.empty{padding:22px 14px;text-align:center;color:var(--muted);font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom) + 18px);background:var(--black);color:var(--black-ink);border-radius:12px;padding:10px 16px;font-size:14px;font-weight:600;z-index:60;max-width:calc(100% - 32px);box-shadow:0 6px 18px rgba(0,0,0,.2)}
table.mom{width:100%;border-collapse:collapse;font-size:13.5px}
table.mom td{padding:8px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.mom tr:last-child td{border-bottom:none}
table.mom td:not(:first-child){text-align:right;white-space:nowrap;padding-left:8px}
table.mom tr.child td:first-child{padding-left:14px;color:var(--muted)}
table.mom tr.total td{font-weight:800}
table.mom th{font-size:11.5px;color:var(--muted);text-align:right;font-weight:700;padding-bottom:4px}
table.mom th:first-child{text-align:left}

/* lock screen */
.lock{min-height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:18px;padding:32px 24px;color:#fff;text-align:center}
.lock .card{width:100%;max-width:360px;color:var(--ink);text-align:left}
.lock svg.logo{width:64px;height:64px}

@media (min-width:700px){
  .grid2.four{grid-template-columns:repeat(4,1fr)}
}
a.pill-btn{color:inherit;text-decoration:none}

</style>
</head>
<body>
<div id="lock" class="app" hidden></div>
<div id="app" class="app" hidden>
  <header class="hdr">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="rgba(255,255,255,.16)"/><circle cx="16" cy="16" r="10.5" fill="none" stroke="#e9d9a6" stroke-width="1.6"/><rect x="11" y="16" width="2.6" height="5.5" rx="1.2" fill="#fff"/><rect x="14.7" y="13" width="2.6" height="8.5" rx="1.2" fill="#fff"/><rect x="18.4" y="10.5" width="2.6" height="11" rx="1.2" fill="#e9d9a6"/></svg>
      <span>Net Worth</span>
    </div>
    <div class="hdr-actions">
      <button class="round" type="button" id="btn-refresh" aria-label="Refresh prices now"></button>
      <button class="round avatar" type="button" id="btn-settings" aria-label="Settings and backup">A</button>
    </div>
  </header>
  <main class="main">
    <section class="view" id="view-home" aria-label="Home"></section>
    <section class="view" id="view-activity" aria-label="Activity"></section>
    <section class="view" id="view-markets" aria-label="Markets"></section>
    <section class="view" id="view-holdings" aria-label="Holdings"></section>
  </main>
  <nav class="tabbar" aria-label="Sections">
    <a href="#home" data-tab="home"></a>
    <a href="#activity" data-tab="activity"></a>
    <button type="button" class="add" id="btn-add" aria-label="Add"></button>
    <a href="#markets" data-tab="markets"></a>
    <a href="#holdings" data-tab="holdings"></a>
  </nav>
</div>
<div id="sheet-root"></div>
<div id="toast" class="toast" role="status" hidden></div>
<script type="module">
window.NWL_SINGLE = true;
/* Net Worth Ledger: shared data model and calculations.
   Used by the app (browser) and by the Cloudflare Worker (daily price updates). */

const BANK = ['cib', 'fawry', 'nbe', 'bm'];
const ACC = {
  cib:   { name: 'CIB Account',          short: 'CIB',         role: 'Payroll · daily spend' },
  fawry: { name: 'Fawry Prepaid Card',   short: 'Fawry',       role: 'Monthly must-pays' },
  nbe:   { name: 'NBE Account',          short: 'NBE',         role: 'Apartment & big spends' },
  bm:    { name: 'Banque Misr Account',  short: 'Banque Misr', role: 'Emergency & fun' },
  egp:   { name: 'EGP Cash', short: 'EGP Cash', role: 'Cash on hand' },
  usd:   { name: 'USD Cash', short: 'USD Cash', role: 'Foreign cash', cur: 'USD' },
  aed:   { name: 'AED Cash', short: 'AED Cash', role: 'Foreign cash', cur: 'AED' }
};
const EGP_ACCTS = ['cib', 'fawry', 'nbe', 'bm', 'egp'];   // accounts you can pay from or into (all in EGP)
const ACCOUNT_KEYS = ['cib', 'fawry', 'nbe', 'bm', 'egp', 'usd', 'aed'];
const CATS = {
  cib: ['Food & Groceries', 'Going Out', 'Misc Daily Spend'],
  fawry: ['Car Gas', 'Mobile Bill', 'Car Wash'],
  nbe: ['Apartment & Big Spend'],
  bm: ['Emergency', 'Fun Spend'],
  egp: ['Cash Spend']
};
const TRANSFER_CAT = { fawry: 'Transfer – Must-Pays', nbe: 'Transfer – Apartment & Big Spends', bm: 'Transfer – Emergency & Fun', cib: 'Transfer – Back to CIB' };
const TYPE_LABEL = { salary: 'Salary', transfer: 'Transfer', expense: 'Expense', adjust: 'Adjustment', invest: 'Investment trade' };
const KIND_LABEL = { stock: 'Stock', fund: 'Equity fund', cash: 'Cash' };
const kindOf = k => k === 'fund' ? 'fund' : k === 'cash' ? 'cash' : 'stock';
const DEFAULT_RATES = { usd: 54.73, aed: 14.90, k24: 6194, k21: 5419, k18: 4645, date: '2026-11-24', updatedAt: null, source: 'manual' };
const DEFAULT_SETTINGS = {
  autoUpdate: true,          // scheduled 9:00 and 15:30 Cairo updates
  goldPremiumPct: 0,         // local Egyptian premium over world gold price
  usdSymbol: 'USDEGP.FOREX',
  aedSymbol: 'AEDEGP.FOREX',
  goldSymbol: 'XAUUSD.FOREX',
  stockSuffix: '.EGX',
  accountOrder: ['cib', 'fawry', 'nbe', 'bm', 'egp', 'usd', 'aed']   // order of the Accounts list on Home
};
const TROY_OZ_G = 31.1034768;
const AED_PER_USD = 3.6725;

/* ---------- small helpers ---------- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const num = v => { const x = Number(v); return Number.isFinite(x) ? x : 0; };
const round2 = v => Math.round(v * 100) / 100;
const isDate = s => /^\d{4}-\d{2}-\d{2}$/.test(String(s));
const isMonth = s => /^\d{4}-\d{2}$/.test(String(s));
const monthOf = d => String(d || '').slice(0, 7);
function cairoParts(d = new Date()) {
  const f = new Intl.DateTimeFormat('en-CA', { timeZone: 'Africa/Cairo', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
  const p = Object.fromEntries(f.formatToParts(d).map(x => [x.type, x.value]));
  return { date: `${p.year}-${p.month}-${p.day}`, h: Number(p.hour), m: Number(p.minute) };
}
const todayCairo = () => cairoParts().date;
function prevMonth(m) { let [y, mo] = m.split('-').map(Number); mo--; if (mo < 1) { mo = 12; y--; } return y + '-' + String(mo).padStart(2, '0'); }
function fxRate(cur, r) { return cur === 'USD' ? num(r.usd) : cur === 'AED' ? num(r.aed) : 1; }
function karatRate(k, r) { return k === 24 ? num(r.k24) : k === 21 ? num(r.k21) : num(r.k18); }

/* ---------- cleaning / normalizing ---------- */
function blank() {
  return { version: 3, sample: false, rates: { ...DEFAULT_RATES }, settings: { ...DEFAULT_SETTINGS },
    transactions: [], gold: [], goldLog: [], investments: [], invLog: [], snapshots: [], marketLog: [] };
}
function cleanTx(t) {
  if (!t || !TYPE_LABEL[t.type]) return null;
  const date = isDate(t.date) ? String(t.date) : todayCairo();
  return { id: String(t.id || uid()), date, month: isMonth(t.month) ? String(t.month) : monthOf(date), type: t.type,
    amount: num(t.amount), account: String(t.account || ''), from: String(t.from || ''), to: String(t.to || ''),
    mode: t.type === 'invest' ? (t.mode === 'sell' ? 'sell' : 'buy') : (t.mode === 'delta' ? 'delta' : 'set'),
    category: String(t.category || ''), note: String(t.note || ''), created: num(t.created) || Date.now() };
}
function cleanGold(g) {
  if (!g) return null;
  const k = Number(g.karat);
  return { id: String(g.id || uid()), label: String(g.label || 'Gold'), kind: String(g.kind || 'Coin / Pound'),
    karat: [24, 21, 18].includes(k) ? k : 21, count: num(g.count), grams: num(g.grams), note: String(g.note || '') };
}
function cleanInv(i) {
  if (!i || !String(i.name || '').trim()) return null;
  return { id: String(i.id || uid()), kind: kindOf(i.kind), name: String(i.name).trim(),
    ticker: String(i.ticker || '').trim().toUpperCase(), symbol: String(i.symbol || '').trim().toUpperCase(),
    cur: ['USD', 'AED'].includes(i.cur) ? i.cur : 'EGP', qty: num(i.qty),
    cost: i.cost === '' || i.cost == null ? null : num(i.cost), price: num(i.price),
    priceDate: isDate(i.priceDate) ? String(i.priceDate) : '', priceSource: String(i.priceSource || 'manual'), note: String(i.note || '') };
}
function cleanSnap(s) {
  if (!s || !isDate(s.date) || !s.rates || !s.q) return null;
  const r = s.rates, q = s.q;
  return { id: String(s.id || uid()), date: String(s.date), ts: num(s.ts) || Date.now(), source: String(s.source || 'manual'), feed: String(s.feed || ''),
    rates: { usd: num(r.usd), aed: num(r.aed), k24: num(r.k24), k21: num(r.k21), k18: num(r.k18) },
    q: { cib: num(q.cib), fawry: num(q.fawry), nbe: num(q.nbe), bm: num(q.bm), egp: num(q.egp), usd: num(q.usd), aed: num(q.aed),
      g24: num(q.g24), g21: num(q.g21), g18: num(q.g18),
      inv: Array.isArray(q.inv) ? q.inv.filter(Boolean).map(i => ({ id: String(i.id), name: String(i.name || ''), ticker: String(i.ticker || ''),
        kind: kindOf(i.kind), cur: ['USD', 'AED'].includes(i.cur) ? i.cur : 'EGP', qty: num(i.qty), price: num(i.price) })) : [] },
    bank: num(s.bank), fx: num(s.fx), usdE: num(s.usdE), aedE: num(s.aedE), gold: num(s.gold), invE: num(s.invE), total: num(s.total) };
}
const cleanLog = x => x && typeof x === 'object';
function normalize(o) {
  const b = blank();
  if (!o || typeof o !== 'object') return b;
  const r = o.rates || {};
  return {
    version: 3, sample: !!o.sample,
    rates: { usd: num(r.usd) || b.rates.usd, aed: num(r.aed) || b.rates.aed, k24: num(r.k24) || b.rates.k24, k21: num(r.k21) || b.rates.k21,
      k18: num(r.k18) || b.rates.k18, date: isDate(r.date) ? String(r.date) : b.rates.date, updatedAt: num(r.updatedAt) || null, source: String(r.source || 'manual') },
    settings: { ...DEFAULT_SETTINGS, ...(o.settings && typeof o.settings === 'object' ? o.settings : {}) },
    transactions: Array.isArray(o.transactions) ? o.transactions.map(cleanTx).filter(Boolean) : [],
    gold: Array.isArray(o.gold) ? o.gold.map(cleanGold).filter(Boolean) : [],
    goldLog: Array.isArray(o.goldLog) ? o.goldLog.filter(cleanLog) : [],
    investments: Array.isArray(o.investments) ? o.investments.map(cleanInv).filter(Boolean) : [],
    invLog: Array.isArray(o.invLog) ? o.invLog.filter(cleanLog) : [],

/* Every change goes through commit(): it is applied here at once, then saved to your Worker.

async function commit(mutate, okMsg) {

    if (res.status === 409 && mutate) {
      state = normalize(res.body.state); version = res.body.version;
      mutate(state); refreshSnapshotDeltas(state);
      res = await api('/api/state', { method: 'PUT', body: JSON.stringify({ state, baseVersion: version }) });
    }
    if (res.status === 409) { syncing = false; renderSyncIcon(); conflictSheet(res.body); return; }
    if (res.status !== 200) throw new Error((res.body && res.body.error) || 'HTTP ' + res.status);
    version = res.body.version; dirty = false; lastSync = Date.now(); saveCache();
  } catch (e) {
    if (e.code === 401) return showLock('Your passcode changed. Enter it again.');
    toast('Saved on this phone. It will sync when you\'re back online.');
  }
  syncing = false; renderSyncIcon(); renderAll();
}

  if (mode !== 'server') return;
  try {
    const res = await api('/api/state');
    if (res.status !== 200) throw new Error((res.body && res.body.error) || 'HTTP ' + res.status);
    if (res.body.empty) {
      if (dirty || state.transactions.length || state.investments.length) return push(null);
      return firstRunSheet();
    }
    if (dirty) {
      if (res.body.version === version) return push(null);
      return conflictSheet(res.body);

    state = normalize(res.body.state); version = res.body.version; lastSync = Date.now();
    refreshSnapshotDeltas(state); saveCache(); renderAll();

  }
}

    state = normalize(res.body.state); version = res.body.version; lastSync = Date.now(); dirty = false;
    refreshSnapshotDeltas(state); saveCache();
    const e = res.body.entry;

  }

}

/* =========================================================
   GitHub price feed (when the app is hosted on GitHub Pages)
   A GitHub Actions workflow writes prices.json at 9:00 and 15:30 Cairo time.
   The app reads it on open, updates rates and prices, and saves a snapshot

  const urls = [];
  const m = location.hostname.match(/^([a-z0-9-]+)\.github\.io$/i);

    const repo = seg && !seg.includes('.') ? seg : `${m[1]}.github.io`;
    urls.push(`https://raw.githubusercontent.com/${m[1]}/${repo}/HEAD/prices.json`);

}

      if (!r.ok) continue;

}
/* Applies the feed to a state; returns how many things changed. */
function applyFeed(st, f) {
  if (!f || st.settings.autoUpdate === false) return 0;
  const days = Object.keys(f.days || {}).filter(isDate).sort();
  if (!days.length) return 0;
  const cutoff = cairoParts(new Date(Date.now() - 60 * 864e5)).date;
  const hasData = st.transactions.length || st.gold.length || st.investments.length;

    const px = {};
    st.investments.forEach(i => { const v = num((x.prices || {})[feedKey(i)]); if (v > 0) px[i.id] = v; });
    const snap = makeSnapshot(st, { ...r, date: d }, px, 'auto · ' + (x.slot === 'close' ? '15:30' : x.slot === 'morning' ? '9:00' : 'manual run'));

}

function barChart(el, items) {
  if (!el) return;
  if (items.length < 2) { el.innerHTML = '<p class="empty">Daily changes appear after two snapshots.</p>'; return; }
  const W = Math.max(280, el.clientWidth || 320), H = 150, top = 18, bottom = 22;
  const vals = items.map(x => x.value);
  const maxAbs = Math.max(1, ...vals.map(Math.abs));
  const hasNeg = vals.some(v => v < 0), hasPos = vals.some(v => v > 0);
  const zeroY = hasNeg && hasPos ? top + (H - top - bottom) * (Math.max(...vals, 0) / (Math.max(...vals, 0) - Math.min(...vals, 0))) : hasNeg ? top : H - bottom;
  const scale = (H - top - bottom) / (hasNeg && hasPos ? (Math.max(...vals) - Math.min(...vals)) : maxAbs);
  const n = items.length, gap = n > 20 ? 3 : 6, bw = Math.min(28, (W - gap * (n - 1)) / n);
  const x0 = (W - (bw * n + gap * (n - 1))) / 2;
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily change in net worth for the last ${n} snapshots">`;
  svg += `<line x1="0" x2="${W}" y1="${zeroY}" y2="${zeroY}" stroke="var(--line)" stroke-width="1"/>`;
  items.forEach((it, i) => {
    const h = Math.max(3, Math.abs(it.value) * scale), x = x0 + i * (bw + gap);
    const y = it.value >= 0 ? zeroY - h : zeroY;
    const last = i === n - 1;
    const fill = it.value >= 0 ? (last ? 'var(--brand)' : 'var(--brand-soft)') : (last ? 'var(--bad)' : 'var(--bad-soft)');
    svg += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="${Math.min(6, bw / 2).toFixed(1)}" fill="${fill}"/>`;
    if (n <= 10 || i === 0 || last || i === Math.floor(n / 2)) svg += `<text x="${(x + bw / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle">${esc(n <= 10 ? String(Number(it.date.slice(8))) : dateLabel(it.date))}</text>`;
  });
  svg += `<rect id="bc-hit" x="0" y="0" width="${W}" height="${H}" fill="transparent"/></svg><div class="tip" hidden></div>`;
  el.innerHTML = svg;
  const tip = $('.tip', el), s = $('svg', el);
  const show = ev => {
    const r = s.getBoundingClientRect(), k = W / r.width, px = (ev.clientX - r.left) * k;
    const i = Math.max(0, Math.min(n - 1, Math.floor((px - x0 + gap / 2) / (bw + gap))));
    const it = items[i];
    tip.hidden = false; tip.textContent = `${dateLabel(it.date, true)} · ${signed(it.value)}`;
    const left = (x0 + i * (bw + gap) + bw / 2) / k;
    tip.style.left = Math.max(0, Math.min(r.width - tip.offsetWidth, left - tip.offsetWidth / 2)) + 'px';
    tip.style.top = '-8px';
  };
  $('#bc-hit', el).addEventListener('pointermove', show);
  $('#bc-hit', el).addEventListener('pointerdown', show);
  $('#bc-hit', el).addEventListener('pointerleave', () => { tip.hidden = true; });
}
function lineChart(el, snaps) {
  if (!el) return;
  if (snaps.length < 2) { el.innerHTML = '<p class="empty">Your trend appears after two snapshots.</p>'; return; }
  const W = Math.max(280, el.clientWidth || 320), H = 190, m = { l: 46, r: 10, t: 12, b: 24 };
  const vals = snaps.map(x => x.total);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi - lo < 1) { hi += 1000; lo -= 1000; }
  const raw = (hi - lo) / 3, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;
  const y0 = Math.floor(lo / step) * step, y1 = Math.ceil(hi / step) * step;
  const X = i => m.l + i * (W - m.l - m.r) / (snaps.length - 1);
  const Y = v => m.t + (y1 - v) / (y1 - y0) * (H - m.t - m.b);
  const dec = Math.max(0, Math.min(3, Math.ceil(-Math.log10(step / 1e6) - 1e-9)));
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Net worth from ${esc(egp(vals[0]))} to ${esc(egp(vals[vals.length - 1]))}">`;
  for (let v = y0; v <= y1 + step / 2; v += step) {
    svg += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/>`;
    svg += `<text x="${m.l - 6}" y="${Y(v) + 4}" text-anchor="end">${esc(Math.abs(v) >= 1e6 ? (v / 1e6).toFixed(dec) + 'M' : compact(v))}</text>`;
  }
  const idx = [...new Set([0, Math.floor((snaps.length - 1) / 2), snaps.length - 1])];
  idx.forEach(i => { svg += `<text x="${X(i)}" y="${H - 6}" text-anchor="${i === 0 ? 'start' : i === snaps.length - 1 ? 'end' : 'middle'}">${esc(dateLabel(snaps[i].date))}</text>`; });
  const pts = snaps.map((x, i) => X(i).toFixed(1) + ',' + Y(x.total).toFixed(1));
  svg += `<path d="M${pts[0]} L${pts.join(' L')} L${X(snaps.length - 1).toFixed(1)},${Y(y0)} L${X(0).toFixed(1)},${Y(y0)} Z" fill="var(--brand)" opacity=".12"/>`;
  svg += `<polyline points="${pts.join(' ')}" fill="none" stroke="var(--brand)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
  const li = snaps.length - 1;
  svg += `<circle cx="${X(li)}" cy="${Y(vals[li])}" r="4.5" fill="var(--brand)" stroke="var(--card)" stroke-width="2"/>`;
  svg += `<line class="g" y1="${m.t}" y2="${H - m.b}" stroke="var(--muted)" stroke-dasharray="3 3" visibility="hidden"/><circle class="d" r="4.5" fill="var(--brand)" stroke="var(--card)" stroke-width="2" visibility="hidden"/>`;
  svg += `<rect class="hit" x="${m.l}" y="0" width="${W - m.l - m.r}" height="${H}" fill="transparent"/></svg><div class="tip" hidden></div>`;
  el.innerHTML = svg;
  const s = $('svg', el), tip = $('.tip', el), g = $('.g', el), d = $('.d', el);
  const show = ev => {
    const r = s.getBoundingClientRect(), k = W / r.width, px = (ev.clientX - r.left) * k;
    const i = Math.max(0, Math.min(li, Math.round((px - m.l) / ((W - m.l - m.r) / li))));
    const x = snaps[i];
    g.setAttribute('x1', X(i)); g.setAttribute('x2', X(i)); g.setAttribute('visibility', 'visible');
    d.setAttribute('cx', X(i)); d.setAttribute('cy', Y(x.total)); d.setAttribute('visibility', 'visible');
    tip.hidden = false; tip.textContent = `${dateLabel(x.date)} · ${egp(x.total)}` + (x.delta != null ? ` · ${signed(x.delta)}` : '');
    tip.style.left = Math.max(0, Math.min(r.width - tip.offsetWidth, X(i) / k - tip.offsetWidth / 2)) + 'px';
    tip.style.top = Math.max(0, Y(x.total) / k - 38) + 'px';
  };
  $('.hit', el).addEventListener('pointermove', show);
  $('.hit', el).addEventListener('pointerdown', show);
  $('.hit', el).addEventListener('pointerleave', () => { tip.hidden = true; g.setAttribute('visibility', 'hidden'); d.setAttribute('visibility', 'hidden'); });
}

function txIcon(t) {
  if (t.type === 'salary') return ['wallet', 'good'];
  if (t.type === 'transfer') return ['swap', 'info'];
  if (t.type === 'adjust') return ['sliders', 'warn'];
  if (t.type === 'invest') return ['trend', ''];
  return [CAT_ICON[t.category] || 'bag', 'bad'];
}
function txAmount(t) {
  const c = ACC[t.account] && ACC[t.account].cur;
  if (t.type === 'salary') return `<span class="pos">+${esc(egp(t.amount))}</span>`;
  if (t.type === 'expense') return `−${esc(egp(t.amount))}`;
  if (t.type === 'transfer') return esc(egp(t.amount));
  if (t.type === 'invest') return t.mode === 'sell' ? `<span class="pos">+${esc(egp(t.amount))}</span>` : `−${esc(egp(t.amount))}`;
  return t.mode === 'set' ? '= ' + esc(c ? cur(c, t.amount) : egp(t.amount)) : (t.amount >= 0 ? '+' : '−') + esc(c ? cur(c, Math.abs(t.amount)) : egp(Math.abs(t.amount)));

function accountSheet(k) {
  if (ACC[k].cur || k === 'egp') return cashSheet(k);
  const b = balances(state), st = monthStats(state, ui.month);
  const flows = { inn: 0, out: 0 };
  state.transactions.filter(t => t.month === ui.month).forEach(t => {
    const a = num(t.amount);
    if (t.type === 'salary' && t.account === k) flows.inn += a;
    if (t.type === 'expense' && t.account === k) flows.out += a;
    if (t.type === 'transfer') { if (t.from === k) flows.out += a; if (t.to === k) flows.inn += a; }
    if (t.type === 'invest' && t.account === k) { if (t.mode === 'sell') flows.inn += a; else flows.out += a; }
  });
  const quick = { cib: ['salary', 'daily', 'toFawry', 'toNbe', 'toBm'], fawry: ['gas', 'mobile', 'wash'], nbe: ['toNbe'], bm: ['toBm'] }[k];
  openSheet({ title: ACC[k].name, sub: ACC[k].role,
    body: `<div class="hero"><div class="label">Balance</div><div class="big">${esc(egp(b[k]))}</div><div class="small muted">${esc(monthLabel(ui.month))}: in ${esc(egp(flows.inn))} · out ${esc(egp(flows.out))}</div>
      ${k === 'cib' ? `<div class="small" style="margin-top:6px">Daily pool: <b>${esc(egp(st.poolLeft))}</b> left of ${esc(egp(st.pool))}</div>` : ''}</div>

        ${k !== 'cib' ? `<button class="chip" type="button" data-a="spend">Expense</button>` : ''}</div>

      const sp = $('[data-a=spend]', root); if (sp) sp.addEventListener('click', () => { close(true); txSheet({ f: { type: 'expense', account: k, category: CATS[k][k === 'bm' ? 1 : 0] } }); });

      $('[data-x=paste]', root).addEventListener('click', () => { close(true); pasteSheet(); });
      $('[data-x=sample]', root).addEventListener('click', () => { close(); const smp = sampleState(); commit(s => { Object.keys(s).forEach(k => delete s[k]); Object.assign(s, smp); }, 'Example data loaded'); });
      $('#fr-file', root).addEventListener('change', e => { const f = e.target.files && e.target.files[0]; if (!f) return; close(); const rd = new FileReader(); rd.onload = () => importJSON(String(rd.result)); rd.readAsText(f); });
    } });
}

/* =========================================================
   Lock screen & boot
   ========================================================= */
function showLock(msg) {
  $('#app').hidden = true;
  const l = $('#lock'); l.hidden = false;
  l.innerHTML = `<div class="lock">${$('.brand svg').outerHTML.replace('<svg', '<svg class="logo"')}<div><h2 style="color:#fff;font-size:24px">Net Worth</h2><p style="opacity:.8;margin-top:4px">${esc(msg || 'Enter your passcode')}</p></div>
    <form class="card form" novalidate><div class="field"><label for="pc">Passcode</label><input id="pc" type="password" autocomplete="current-password" required></div><p class="err" id="pc-err" role="alert"></p><button class="btn dark" type="submit">Unlock</button></form></div>`;
  $('form', l).addEventListener('submit', async e => {
    e.preventDefault();
    const v = $('#pc', l).value; if (!v) return;
    lsSet(LS.pass, v);
    try {
      const r = await api('/api/state');
      if (r.status === 503) { $('#pc-err', l).textContent = r.body.error; return; }
      l.hidden = true; $('#app').hidden = false;
      if (r.body.empty) { showTab(location.hash.slice(1) || 'home'); firstRunSheet(); }
      else { state = normalize(r.body.state); version = r.body.version; lastSync = Date.now(); dirty = false; refreshSnapshotDeltas(state); saveCache(); ui.month = null; showTab(location.hash.slice(1) || 'home'); }
    } catch (err) {
      lsDel(LS.pass);
      $('#pc-err', l).textContent = err.code === 401 ? 'That passcode didn\'t work.' : 'Couldn\'t reach the server.';
    }
  });
  setTimeout(() => $('#pc', l).focus(), 50);
}
async function detectMode() {
  if (location.protocol === 'file:' || new URLSearchParams(location.search).has('demo')) return 'local';
  try {
    const r = await fetch('/api/status', { headers: { authorization: 'Bearer ' + (lsGet(LS.pass) || '') } });
    const ct = r.headers.get('content-type') || '';
    return ct.includes('application/json') ? 'server' : 'local';
  } catch { return readCache(LS.cache) ? 'server' : 'local'; }
}
function bindChrome() {
  $$('.tabbar a').forEach(a => { const icn = { home: 'home', activity: 'list', markets: 'chart', holdings: 'layers' }[a.dataset.tab]; a.innerHTML = ic(icn) + `<span>${a.dataset.tab[0].toUpperCase() + a.dataset.tab.slice(1)}</span>`; });
  $('#btn-add').innerHTML = ic('plus');
  $('#btn-add').addEventListener('click', addSheet);
  $('#btn-settings').addEventListener('click', settingsSheet);
  $('#btn-refresh').addEventListener('click', refreshPrices);
  window.addEventListener('hashchange', () => showTab(location.hash.slice(1)));
  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(renderAll, 200); });
  let lastPull = Date.now();
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState !== 'visible' || Date.now() - lastPull < 60000 || sheetClose) return;
    lastPull = Date.now();
    if (mode === 'server') { if (dirty) push(null); else pull(true); }
    else if (mode === 'local' && feed) syncFeed(false);
    else if (mode === 'claude') { if (dirty) cloudSave(); else { try { const st = await cloudLoad(); if (st && !dirty) { state = st; saveCache(); renderAll(); } } catch { /* keep current */ } } }
  });
  document.addEventListener('click', async e => {
    const b = e.target.closest('[data-go],[data-acc],[data-tx],[data-preset],[data-month],[data-act],[data-days],[data-range],[data-hold],[data-inv],[data-gold],[data-cash],[data-snap]');
    if (!b || b.closest('#sheet-root')) return;
    const d = b.dataset;
    if (d.go) { if (d.go === 'accounts') { const l = $('#view-home .list'); if (l) l.scrollIntoView({ behavior: 'smooth' }); } else { ui.holdTab = d.go; go('holdings'); } }
    else if (d.acc) accountSheet(d.acc);
    else if (d.tx) txSheet({ tx: d.tx });
    else if (d.preset) { const p = PRESETS.find(x => x.key === d.preset); txSheet({ f: { ...p.f }, title: p.title, prefill: true }); }
    else if (d.month) { ui.month = d.month; renderAll(); }
    else if (d.days) { ui.chartDays = Number(d.days); renderAll(); }
    else if (d.range) { ui.lineRange = d.range; renderAll(); }
    else if (d.hold) { ui.holdTab = d.hold; renderAll(); }
    else if (d.inv) invSheet(d.inv);
    else if (d.gold) goldSheet(d.gold);
    else if (d.cash) cashSheet(d.cash);
    else if (d.snap) snapSheet(d.snap);
    else if (d.act === 'new-tx') addSheet();
    else if (d.act === 'local-ok') { lsSet('nwl.localNote', '1'); renderAll(); }
    else if (d.act === 'refresh') refreshPrices();
    else if (d.act === 'feed') syncFeed(true);
    else if (d.act === 'rates') ratesSheet();
    else if (d.act === 'trade') tradeSheet();
    else if (d.act === 'new-inv') invSheet();
    else if (d.act === 'new-invcash') invSheet(null, 'cash');
    else if (d.act === 'reorder') reorderSheet();
    else if (d.act === 'new-gold') goldSheet();
    else if (d.act === 'clear-sample') {
      if (!await confirmSheet('Clear example data?', 'Removes the example transactions, holdings and snapshots. Your settings stay.', 'Clear', true)) return;
      ui.month = null;
      commit(s => { const st = s.settings; Object.keys(s).forEach(k => delete s[k]); Object.assign(s, blank(), { settings: st }); }, 'Cleared. Tap an account to set its balance.');
    }
  });
}
async function boot() {
  bindChrome();
  mode = await detectMode();
  if (mode === 'local') {
    // Show this device's copy at once, then switch to your Claude account when the page runs inside Claude.
    const c = readCache(LS.demo);
    state = c ? normalize(c.state) : blank();
    if (c) { dirty = !!c.dirty; lastSync = c.lastSync || null; }
    refreshSnapshotDeltas(state);
    $('#app').hidden = false; showTab(location.hash.slice(1) || 'home');
    if (await connectClaude()) {
      mode = 'claude'; syncing = true; renderAll();
      try {
        const st = await cloudLoad();
        syncing = false;
        if (st) {
          if (dirty && c) cloudSave();            // a change made here before it could be saved: send it
          else { state = st; lastSync = Date.now(); saveCache(); }
          renderAll();
        } else if (c && !c.state.sample && (state.transactions.length || state.investments.length || state.gold.length)) {
          dirty = true; await cloudSave(); renderAll();
        } else { renderAll(); firstRunSheet(); }
      } catch {
        syncing = false; renderAll();
        toast('Couldn\'t reach your Claude data. Showing this device\'s copy.');
      }
    } else {
      renderAll();
      if (!c) firstRunSheet();
      syncFeed(false);
    }
    return;
  }
  const c = readCache(LS.cache);
  if (!lsGet(LS.pass)) return showLock('Enter the passcode you set on Cloudflare.');
  if (c) { state = normalize(c.state); version = c.version || 0; dirty = !!c.dirty; lastSync = c.lastSync || null; refreshSnapshotDeltas(state); }
  $('#app').hidden = false; showTab(location.hash.slice(1) || 'home');
  pull(!!c);
}
if ('serviceWorker' in navigator && location.protocol === 'https:' && !window.NWL_SINGLE && !window.claude) navigator.serviceWorker.register('sw.js').catch(() => {});
boot();

</script>
